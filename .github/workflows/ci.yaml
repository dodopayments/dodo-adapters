name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read

# A new push to a PR cancels the older run of the PR. Runs on main all finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The time budget is in docs/ci-budget.md.
jobs:
  check:
    name: Checks
    env:
      DODO_PAYMENTS_API_KEY: ${{ secrets.DODO_PAYMENTS_API_KEY || 'api-key' }}
      DODO_PAYMENTS_WEBHOOK_SECRET: ${{ secrets.DODO_PAYMENTS_WEBHOOK_SECRET || 'dGhpc19pc19hX3BsYWNlaG9sZGVyX3ZhbHVl' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js environment
        id: node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # The key is the OS, the architecture, the Node version, the lockfile and each package.json, so a
      # manifest change without a lockfile change runs npm clean-install and fails as before. The workspace
      # node_modules folders are in the same entry as the root, so the workspace links stay.
      - name: Restore node_modules
        id: node-modules
        uses: actions/cache@v6
        with:
          path: |
            node_modules
            packages/*/node_modules
            examples/*/node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-node${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json', 'package.json', 'packages/*/package.json', 'examples/*/package.json') }}

      - name: Restore npm download cache
        if: steps.node-modules.outputs.cache-hit != 'true'
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm clean-install --prefer-offline --no-audit --no-fund

      # Turbo replays a task only when the hash of its inputs is the same. A changed package runs again.
      # The Node version is in the key, because the Turbo task hash does not include it.
      - name: Restore Turbo cache
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ runner.arch }}-node${{ steps.node.outputs.node-version }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-${{ runner.arch }}-node${{ steps.node.outputs.node-version }}-

      - name: Run CI checks
        run: npm run ci
